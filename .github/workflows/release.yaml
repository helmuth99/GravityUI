name: Release Workflow

on:
  push:
    tags:
      - "v*"

jobs:
  # Normal release (e.g., v3.0)
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.DEPLOY_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CURSEFORGE_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}"

  # Alpha release (e.g., v3.0-Alpha)
  alpha-release:
    runs-on: ubuntu-latest
    needs: release # Wait for normal release to complete first
    env:
      GITHUB_OAUTH: ${{ secrets.DEPLOY_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      CF_API_KEY: ${{ secrets.CURSEFORGE_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version and create alpha tag
        id: alpha_version
        run: |
          # Get the pushed tag (e.g., v3.0)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # Create alpha version (e.g., v3.0-Alpha)
          ALPHA_TAG="${TAG_NAME}-Alpha"
          echo "alpha_tag=${ALPHA_TAG}" >> $GITHUB_OUTPUT

          # Create and push the alpha tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${ALPHA_TAG}" -m "Alpha release for ${TAG_NAME}"
          git push origin "${ALPHA_TAG}"

      - name: Package and release alpha
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}"
